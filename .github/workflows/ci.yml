name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -D warnings"

  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the
  # same gate. Bump deliberately.
  YATR_VERSION: "1.1.0"
jobs:
  check_formatting:
    name: check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup Rust toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr fmt-check

  check_and_test:
    name: check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cache Cargo build files
        uses: Leafwing-Studios/cargo-cache@ba6ee760ccdefa26b630cff8094e3243ae86a2c9 # v2

      - name: prepare build env
        run: sudo apt-get install -y lld librdkafka-dev libsasl2-dev

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr typecheck
      - run: yatr lint

      - name: unit tests
        run: yatr test
